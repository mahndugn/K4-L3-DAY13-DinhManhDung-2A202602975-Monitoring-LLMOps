alerts:
  - name: elevated_request_error_rate
    severity: critical
    condition: 'error_rate_pct > 2 over 5m'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: api-on-call
    runbook: docs/alerts.md#alert-1
  - name: high_request_latency
    severity: warning
    condition: 'request_latency_p95_ms > 3000 over 10m'
    duration: 10m
    type: symptom-based
    channel: slack
    owner: llmops-on-call
    runbook: docs/alerts.md#alert-2
  - name: low_retrieval_success
    severity: warning
    condition: 'retrieval_success_rate_pct < 90 over 5m'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: retrieval-on-call
    runbook: docs/alerts.md#alert-3
